<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي التناسب - تحدي قناة mathfun</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        :root {
            --primary: #1a5f7a;
            --accent: #ffb100;
            --bg: #f0f4f8;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-card {
            background: white;
            width: 95%;
            max-width: 700px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 8px solid var(--primary);
        }

        .math-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 1.4rem;
            border: 1px dashed var(--primary);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-option {
            background: white;
            border: 2px solid #ddd;
            padding: 15px;
            font-family: 'Cairo';
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-option:hover {
            border-color: var(--primary);
            background: #eef5f8;
            transform: translateY(-3px);
        }

        #certificate {
            display: none;
            padding: 40px;
            border: 15px double var(--primary);
            background: #fff;
            position: relative;
        }

        .cert-header { color: var(--primary); font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; }
        .cert-name { font-size: 2rem; color: #333; margin: 15px 0; border-bottom: 3px solid var(--accent); display: inline-block; }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #eee;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #progress-fill {
            width: 0%;
            height: 100%;
            background: var(--accent);
            transition: 0.5s;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div id="game-card">
        <div id="quiz-ui">
            <h2 style="color: var(--primary);">مسابقة الرياضيات -تحدي قناة mathfun</h2>
            <div class="progress-bar"><div id="progress-fill"></div></div>
            
            <div id="question-container">
                <p id="question-text" style="font-size: 1.2rem; font-weight: bold;"></p>
                <div class="math-box" id="math-display">
                    </div>
                <div class="options-grid" id="options-box"></div>
            </div>
        </div>

        <div id="certificate">
            <div class="cert-header">شهادة تفوق</div>
            <p>يمنح الأستاذ / <strong>تحدي قناة mathfun</strong> هذه الشهادة لـ</p>
            <div class="cert-name" id="user-name"></div>
            <p>تقديراً لذكائه ونجاحه في حل تحديات "خواص التناسب" بنسبة:</p>
            <h2 id="user-grade" style="color: var(--accent);"></h2>
            <p style="font-size: 0.9rem;">بتاريخ: <span id="cert-date"></span></p>
            <button onclick="window.print()" style="margin-top:20px; padding:10px; cursor:pointer;">طباعة الشهادة</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                text: "أوجد الرابع المتناسب للأعداد التالية: 14 ، 12 ، 8",
                math: "$$ \\frac{8}{12} = \\frac{14}{x} $$",
                options: ["21", "18", "24", "16"],
                correct: "21"
            },
            {
                text: "أوجد قيمة a التي تجعل الكميات متناسبة: 3a , 20 , 15 , a",
                math: "$$ \\frac{a}{15} = \\frac{20}{3a} $$",
                options: ["\\pm 5", "\\pm 10", "\\pm 15", "10"],
                correct: "\\pm 10"
            },
            {
                text: "أوجد الثالث المتناسب للأعداد: 35 ، 28 ، 12",
                math: "$$ \\frac{35}{28} = \\frac{x}{12} $$",
                options: ["15", "14", "20", "16"],
                correct: "15"
            },
            {
                text: "إذا كانت الكميات 48 , 9a , 7a , 21 متناسبة، فما قيمة a؟",
                math: "$$ \\frac{21}{7a} = \\frac{9a}{48} $$",
                options: ["4", "8", "\\pm 4", "\\pm 8"],
                correct: "4"
            },
            {
                text: "إذا كان التناسب التالي صحيحاً، فأوجد قيمة x:",
                math: "$$ \\frac{2x + 3}{2x - 3} = \\frac{2(5) + 5}{2(5) - 5} $$",
                options: ["3", "5", "1.5", "2"],
                correct: "3"
            },
            {
                text: "أوجد الثاني المتناسب للأعداد: 2 ، 4 ، 6",
                math: "$$ \\frac{2}{x} = \\frac{4}{6} $$",
                options: ["3", "4", "5", "8"],
                correct: "3"
            },
            {
                text: "حل المعادلة التالية لإيجاد قيمة المجهول:",
                math: "$$ a^2 = \\frac{300}{3} $$",
                options: ["10", "100", "\\pm 10", "30"],
                correct: "\\pm 10"
            },
            {
                text: "في التناسب $$ \\frac{x}{y} = \\frac{3}{5} $$، إذا كانت y=10 فإن x تساوي:",
                math: "",
                options: ["6", "5", "8", "4"],
                correct: "6"
            },
            {
                text: "أوجد الرابع المتناسب لـ: 4 ، 12 ، 5",
                math: "$$ \\frac{4}{12} = \\frac{5}{x} $$",
                options: ["15", "10", "20", "12"],
                correct: "15"
            },
            {
                text: "تحدي قناة mathfun: إذا كان $$ \\frac{a}{b} = \\frac{c}{d} $$ فإن $$ a \\times d $$ يساوي:",
                math: "",
                options: ["b \\times c", "b + c", "a \\times c", "d \\times b"],
                correct: "b \\times c"
            }
        ];

        let currentStep = 0;
        let score = 0;
        let playerName = "";

        window.onload = async () => {
            const { value: name } = await Swal.fire({
                title: 'مرحباً بك في عالم التناسب',
                input: 'text',
                inputLabel: 'ادخل اسمك يا بطل الرياضيات',
                confirmButtonText: 'ابدأ التحدي',
                allowOutsideClick: false,
                inputValidator: (value) => !value && 'يجب إدخال الاسم!'
            });
            
            playerName = name;
            document.getElementById('bgMusic').play();
            renderQuestion();
        };

        function renderQuestion() {
            const q = quizData[currentStep];
            document.getElementById('question-text').innerText = q.text;
            const mathDisplay = document.getElementById('math-display');
            mathDisplay.innerHTML = q.math;
            
            // تحديث MathJax لعرض المعادلات الجديدة
            MathJax.typeset();

            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerHTML = `\\( ${opt} \\)`; // وضع الخيارات داخل MathJax
                btn.onclick = () => checkAnswer(opt);
                optionsBox.appendChild(btn);
            });
            MathJax.typesetPromise();

            document.getElementById('progress-fill').style.width = `${(currentStep/10)*100}%`;
        }

        function checkAnswer(selected) {
            if (selected === quizData[currentStep].correct) {
                score++;
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                Swal.fire({ icon: 'success', title: 'عبقري!', timer: 1000, showConfirmButton: false });
            } else {
                Swal.fire({ icon: 'error', title: 'ركز أكثر!', text: `الإجابة الصحيحة هي: ${quizData[currentStep].correct}`, timer: 2000 });
            }

            currentStep++;
            if (currentStep < quizData.length) {
                setTimeout(renderQuestion, 500);
            } else {
                finishGame();
            }
        }

        function finishGame() {
            document.getElementById('quiz-ui').classList.add('hidden');
            const cert = document.getElementById('certificate');
            cert.style.display = 'block';
            document.getElementById('user-name').innerText = playerName;
            document.getElementById('user-grade').innerText = `${(score/10)*100}%`;
            document.getElementById('cert-date').innerText = new Date().toLocaleDateString('ar-EG');
            
            // تأثير احتفالي نهائي
            var end = Date.now() + (15 * 1000);
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
