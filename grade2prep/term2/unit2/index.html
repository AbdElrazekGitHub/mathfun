<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الوحدة 2 - الجبر</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Cairo',sans-serif;
  background:#f5f7fb;
}

/* Header */
header{
  background:linear-gradient(135deg,#7c3aed,#9333ea);
  color:#fff;
  padding:30px;
  text-align:center;
}

/* Container */
.container{
  max-width:1000px;
  margin:40px auto;
  padding:0 15px;
}

/* Layout */
.unit-box{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  align-items:center;
}

/* Image */
.unit-image{
  flex:1;
}

.unit-image img{
  width:100%;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}

/* Lessons */
.lessons{
  flex:1;
  background:#fff;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.lessons h2{
  color:#7c3aed;
  margin-bottom:15px;
}

.lesson{
  padding:15px;
  border-bottom:1px solid #eee;
}

.lesson:last-child{
  border:none;
}

.lesson a{
  text-decoration:none;
  color:#333;
  font-weight:600;
  display:flex;
  justify-content:space-between;
  transition:.3s;
}

.lesson a:hover{
  color:#7c3aed;
  transform:translateX(-5px);
}

/* Back Button */
.back{
  display:inline-block;
  margin-top:30px;
  padding:10px 20px;
  background:#7c3aed;
  color:#fff;
  border-radius:30px;
  text-decoration:none;
}

</style>

</head>

<body>

<header>
<h1>الوحدة الثانية - الجبر</h1>
<p>اختر الدرس لبدء التعلم</p>
</header>

<div class="container">

<div class="unit-box">

  <!-- الصورة -->
  <div class="unit-image">
    <img src="https://github.com/AbdElrazekGitHub/mathfun/blob/main/images/unit2.png" alt="الوحدة الثانية">
  </div>

  <!-- الدروس -->
  <div class="lessons">

    <h2>دروس الوحدة</h2>

    <div class="lesson">
      <a href="unit2/lesson1.html">
        <span>2-1 حاصل الضرب الديكارتي</span>
        <span>▶</span>
      </a>
    </div>

    <div class="lesson">
      <a href="unit2/lesson2.html">
        <span>2-2 العلاقة والدالة</span>
        <span>▶</span>
      </a>
    </div>

    <div class="lesson">
      <a href="unit2/lesson3.html">
        <span>2-3 الدالة الخطية</span>
        <span>▶</span>
      </a>
    </div>

    <div class="lesson">
      <a href="unit2/lesson4.html">
        <span>2-4 معادلات ومتباينات الدرجة الأولى</span>
        <span>▶</span>
      </a>
    </div>

  </div>

</div>

<!-- زر الرجوع -->
<a class="back" href="../index.html">⬅ الرجوع للترم</a>

</div>

</body>
</html>
