<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1-2 التناسب المتسلسل</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Cairo',sans-serif;
  background:#f9fafb;
}

header{
  background:#06b6d4;
  color:#fff;
  padding:35px;
  text-align:center;
}

.container{
  max-width:900px;
  margin:40px auto;
  padding:0 15px;
}

/* Accordion */

.accordion-item{
  background:#fff;
  margin-bottom:20px;
  border-radius:15px;
  box-shadow:0 6px 15px rgba(0,0,0,.07);
  overflow:hidden;
}

.accordion-header{
  padding:18px 20px;
  cursor:pointer;
  font-weight:600;
  font-size:18px;
  background:#eef9fc;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.accordion-header:hover{
  background:#dff4f9;
}

.accordion-content{
  max-height:0;
  overflow:hidden;
  transition:0.4s ease;
  padding:0 20px;
}

.accordion-content.active{
  padding:20px;
  max-height:1000px;
}

.video{
  position:relative;
  padding-top:56.25%;
  margin-bottom:20px;
}

.video iframe{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border-radius:12px;
}

.btn{
  display:inline-block;
  padding:12px 25px;
  background:#06b6d4;
  color:#fff;
  border-radius:30px;
  text-decoration:none;
  transition:.3s;
}

.btn:hover{
  background:#0891b2;
}
</style>
</head>

<body>

<header>
<h1>1-2 التناسب المتسلسل</h1>
</header>

<div class="container">

  <!-- الجزء الوحيد -->
  <div class="accordion-item">
    <div class="accordion-header">
      شرح الدرس
      <span>+</span>
    </div>

    <div class="accordion-content">

      <div class="video">
        <iframe src="https://www.youtube.com/embed/VIDEO_ID" allowfullscreen></iframe>
      </div>

      <p>بعد مشاهدة الشرح جرب اللعبة 👇</p>

      <br>

      <a class="btn" href="https://AbdelrazekGitHub.github.io/mathfun/games/lesson2212-game.html">
      ابدأ اللعبة
      </a>

    </div>
  </div>

</div>

<script>

const headers = document.querySelectorAll(".accordion-header");

headers.forEach(header => {

  header.addEventListener("click", () => {

    const content = header.nextElementSibling;

    document.querySelectorAll(".accordion-content").forEach(item=>{

      if(item !== content){

        item.classList.remove("active");

        item.previousElementSibling.querySelector("span").innerHTML = "+";

      }

    });

    content.classList.toggle("active");

    header.querySelector("span").innerHTML =
      content.classList.contains("active") ? "−" : "+";

  });

});

</script>

</body>
</html>
